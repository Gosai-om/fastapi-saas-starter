[project]
name = "fastapi-saas-starter"
version = "1.0.0"
description = "Production-style FastAPI starter: JWT auth, RBAC, async SQLAlchemy, Alembic, Celery + Redis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI uses function calls in defaults (Depends/Query)

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/services/users.py" = ["S101"]
